<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Indra · Origo Labs</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#091720;color:#eaf8fa;font:16px system-ui,sans-serif}
main{text-align:center;max-width:480px;padding:32px} .mark{width:60px;height:60px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #37d4e7;border-radius:20px;color:#54e4ef;font-size:32px;box-shadow:0 0 64px #26cddd26}
h1{font-size:32px;margin:0 0 7px;letter-spacing:-1px}.brand{font-size:10px;letter-spacing:4px;color:#8bafb7;margin:0 0 38px}h2{font-size:18px;font-weight:500;margin:0 0 10px}p{color:#91adb6;line-height:1.6;font-size:14px}
.track{height:3px;background:#1b3640;border-radius:4px;overflow:hidden;margin:24px auto;width:210px}.track::after{content:"";display:block;width:45%;height:100%;background:#46d6e6;animation:progress 1.2s ease-in-out infinite alternate}
@keyframes progress{to{transform:translateX(125%)}}@media(prefers-reduced-motion:reduce){.track::after{animation:none;width:100%}}
</style></head><body><main><div class="mark" aria-hidden="true">◈</div><h1>Indra</h1><div class="brand">ORIGO LABS</div><h2>Opening your workspace</h2><div class="track" role="progressbar" aria-label="Starting Indra"></div><p>Starting local services. Your workspace will appear here shortly.</p></main></body></html>
