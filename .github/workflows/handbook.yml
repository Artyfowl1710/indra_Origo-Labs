name: Publish Indra handbook
on:
  push:
    branches: [main]
    paths: ['docs/handbook/**', 'docs/media/**', 'scripts/build_handbook.py', '.github/workflows/handbook.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install Markdown==3.10.2
      - run: python scripts/build_handbook.py
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy handbook
        id: deployment
        uses: actions/deploy-pages@v5.0.1
