name: Feature request
description: Describe a workflow Indra could support better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and the limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the result you would like and any approach you have tried.
    validations:
      required: true
